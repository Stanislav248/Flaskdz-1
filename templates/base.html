<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Візитка{% endblock %} — {{ me.name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <a class="brand" href="{{ url_for('index') }}">{{ me.name }}</a>
        <nav>
            <a href="{{ url_for('index') }}">Головна</a>
            <a href="{{ url_for('about') }}">Про мене</a>
            <a href="{{ url_for('skills') }}">Навички</a>
            <a href="{{ url_for('api_me') }}">JSON</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; {{ me.name }}, {{ me.city }}</p>
    </footer>
</body>
</html>
